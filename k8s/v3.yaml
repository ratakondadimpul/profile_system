
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-v3
  template:
    metadata:
      labels:
        app: profile-v3
    spec:
      containers:
        - name: profile
          image: dimpulratakonda/profile-system:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: profile-v3-service
spec:
  type: ClusterIP
  selector:
    app: profile-v3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
