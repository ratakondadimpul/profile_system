<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1e9">
    <meta name="description" content="Contact and profile details for Ratakonda Dimpul.">
    <title>Profile — Ratakonda Dimpul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-display: "Lora", Georgia, serif;
        --font-text: "Work Sans", "Helvetica Neue", sans-serif;
        --step--1: .75rem;
        --step-0: 1rem;
        --step-1: 1.333rem;
        --step-2: 1.777rem;
        --step-3: 2.369rem;
        --step-4: 3.157rem;
        --step-5: 4.209rem;
        --step-6: 5.61rem;
        --space-3xs: .25rem;
        --space-2xs: .5rem;
        --space-xs: .75rem;
        --space-s: 1rem;
        --space-m: 1.5rem;
        --space-l: 2rem;
        --space-xl: 3rem;
        --space-2xl: 4.5rem;
        --space-3xl: 7rem;
        --base: #f5f1e9;
        --surface: #fbf9f4;
        --ink: #211e1a;
        --ink-2: #5e574e;
        --ink-3: #70685e;
        --line: #d8d0c4;
        --accent: #a74732;
        --radius: 0;
        --border: 1px solid var(--line);
        --shadow: none;
        --dur-fast: 120ms;
        --dur: 220ms;
        --dur-slow: 420ms;
        --ease: cubic-bezier(.2, 0, 0, 1);
        --ease-out: cubic-bezier(.16, 1, .3, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        background: var(--base);
        color: var(--ink);
        font-family: var(--font-text);
        font-size: var(--step-0);
        line-height: 1.5;
      }

      .page {
        width: min(100% - var(--space-l), 72rem);
        min-height: 100svh;
        margin-inline: auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .masthead,
      .folio {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-m);
        color: var(--ink-2);
        font-size: var(--step--1);
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .masthead {
        padding-block: var(--space-l);
        border-bottom: var(--border);
      }

      .masthead p,
      .folio p {
        margin: 0;
      }

      .masthead__mark {
        color: var(--accent);
      }

      main {
        display: grid;
        align-content: center;
        padding-block: var(--space-3xl);
      }

      .profile {
        display: grid;
        grid-template-columns: minmax(10rem, 1fr) minmax(0, 2.3fr);
        gap: var(--space-2xl);
      }

      .identity {
        align-self: start;
        min-height: 12rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-l);
        border-left: 2px solid var(--accent);
        padding-left: var(--space-m);
      }

      .identity__photo {
        display: block;
        width: min(100%, 12rem);
        height: auto;
        aspect-ratio: 1;
        border: var(--border);
        object-fit: cover;
      }

      .identity__label,
      .section-label,
      .detail__label {
        margin: 0;
        color: var(--ink-3);
        font-size: var(--step--1);
        font-weight: 500;
        letter-spacing: .1em;
        text-transform: uppercase;
      }

      .profile__name {
        max-width: 10ch;
        margin: 0;
        font-family: var(--font-display);
        font-size: var(--step-5);
        font-weight: 400;
        letter-spacing: -.045em;
        line-height: 1.05;
        text-wrap: balance;
      }

      .profile__role {
        margin: var(--space-m) 0 0;
        color: var(--ink-2);
        font-size: var(--step-1);
      }

      .details {
        margin-top: var(--space-3xl);
      }

      .section-label {
        margin-bottom: var(--space-m);
      }

      .detail-list {
        margin: 0;
        border-top: var(--border);
      }

      .detail {
        display: grid;
        grid-template-columns: minmax(8rem, .75fr) minmax(0, 1.5fr);
        gap: var(--space-m);
        padding-block: var(--space-m);
        border-bottom: var(--border);
      }

      .detail__label {
        align-self: center;
      }

      .detail__value {
        margin: 0;
        overflow-wrap: anywhere;
        color: var(--ink);
      }

      .detail__value a {
        color: inherit;
        text-decoration-color: var(--line);
        text-underline-offset: var(--space-3xs);
      }

      .detail__value a:hover {
        color: var(--accent);
        text-decoration-color: currentColor;
      }

      .detail__value a:active {
        color: var(--accent);
      }

      .detail__value a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: var(--space-3xs);
      }

      .folio {
        padding-block: var(--space-m);
        border-top: var(--border);
        color: var(--ink-3);
      }

      @media (max-width: 42rem) {
        .page {
          width: min(100% - var(--space-m), 72rem);
        }

        .masthead {
          padding-block: var(--space-m);
        }

        main {
          align-content: start;
          padding-block: var(--space-2xl);
        }

        .profile {
          grid-template-columns: 1fr;
          gap: var(--space-xl);
        }

        .identity {
          min-height: 0;
          flex-direction: row;
          align-items: center;
        }

        .identity__photo {
          width: var(--space-3xl);
        }

        .profile__name {
          font-size: var(--step-4);
        }

        .details {
          margin-top: var(--space-2xl);
        }

        .detail {
          grid-template-columns: minmax(5rem, .4fr) minmax(0, 1.6fr);
          gap: var(--space-s);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead" aria-label="Profile record">
        <p><span class="masthead__mark">Profile</span> / User details</p>
      </header>

      <main>
        <article class="profile" aria-labelledby="profile-name">
          <aside class="identity" aria-label="Profile identifier">
            <p class="identity__label">Personal profile</p>
            <img class="identity__photo" src="image.png" width="720" height="720" alt="Profile picture">
          </aside>

          <div class="profile__content">
            <header>
              <h1 class="profile__name" id="profile-name">Ratakonda Dimpul</h1>
            </header>

            <section class="details" aria-labelledby="details-heading">
              <h2 class="section-label" id="details-heading">Personal details</h2>
              <dl class="detail-list">
                <div class="detail">
                  <dt class="detail__label">Email</dt>
                  <dd class="detail__value"><a href="mailto:ratakondadimpul2628@gmail.com">ratakondadimpul2628@gmail.com</a></dd>
                </div>
                <div class="detail">
                  <dt class="detail__label">Phone</dt>
                  <dd class="detail__value"><a href="tel:+918328570644">+91 8328570644</a></dd>
                </div>
                <div class="detail">
                  <dt class="detail__label">Location</dt>
                  <dd class="detail__value">Vellore Institute of Technology</dd>
                </div>
                <div class="detail">
                  <dt class="detail__label">Joined</dt>
                  <dd class="detail__value"><time datetime="2026-07-26">July 26, 2026</time></dd>
                </div>
              </dl>
            </section>
          </div>
        </article>
      </main>

      <footer class="folio">
        <p>Personal profile</p>
        <p>RD</p>
      </footer>
    </div>
  </body>
</html>
