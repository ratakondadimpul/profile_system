<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1e9">
    <meta name="description" content="Contact and profile details for Ratakonda Dimpul.">
    <title>Profile — Ratakonda Dimpul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-display: "Lora", Georgia, serif;
        --font-text: "Work Sans", "Helvetica Neue", sans-serif;
        --step--1: .75rem;
        --step-0: 1rem;
        --step-1: 1.333rem;
        --step-2: 1.777rem;
        --step-3: 2.369rem;
        --step-4: 3.157rem;
        --step-5: 4.209rem;
        --step-6: 5.61rem;
        --space-3xs: .25rem;
        --space-2xs: .5rem;
        --space-xs: .75rem;
        --space-s: 1rem;
        --space-m: 1.5rem;
        --space-l: 2rem;
        --space-xl: 3rem;
        --space-2xl: 4.5rem;
        --space-3xl: 7rem;
        --base: #f5f1e9;
        --surface: #fbf9f4;
        --ink: #211e1a;
        --ink-2: #5e574e;
        --ink-3: #70685e;
        --line: #d8d0c4;
        --accent: #a74732;
        --radius: 0;
        --border: 1px solid var(--line);
        --shadow: none;
        --dur-fast: 120ms;
        --dur: 220ms;
        --dur-slow: 420ms;
        --ease: cubic-bezier(.2, 0, 0, 1);
        --ease-out: cubic-bezier(.16, 1, .3, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        background: var(--base);
        color: var(--ink);
        font-family: var(--font-text);
        font-size: var(--step-0);
        line-height: 1.5;
      }

      .page {
        width: min(100% - var(--space-l), 72rem);
        min-height: 100svh;
        margin-inline: auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .masthead,
      .folio {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-m);
        color: var(--ink-2);
        font-size: var(--step--1);
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .masthead {
        padding-block: var(--space-l);
        border-bottom: var(--border);
      }

      .masthead p,
      .folio p {
        margin: 0;
      }

      .masthead__mark {
        color: var(--accent);
      }

      main {
        display: grid;
        align-content: center;
        padding-block: var(--space-3xl);
      }

      .profile {
        display: grid;
        grid-template-columns: minmax(10rem, 1fr) minmax(0, 2.3fr);
        gap: var(--space-2xl);
      }

      .identity {
        align-self: start;
        min-height: 12rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-l);
        border-left: 2px solid var(--accent);
        padding-left: var(--space-m);
      }

      .identity__photo {
        display: block;
        width: min(100%, 12rem);
        height: auto;
        aspect-ratio: 1;
        border: var(--border);
        object-fit: cover;
      }

      .photo-editor {
        display: grid;
        gap: var(--space-2xs);
      }

      .photo-editor label {
        color: var(--ink-2);
        font-size: var(--step--1);
        font-weight: 500;
      }

      .photo-editor input {
        width: 100%;
        max-width: 15rem;
        color: var(--ink-2);
        font: var(--step--1) var(--font-text);
      }

      .photo-editor input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: var(--space-3xs);
      }

      .photo-editor input::file-selector-button {
        min-height: 2.75rem;
        margin-right: var(--space-xs);
        border: var(--border);
        border-radius: var(--radius);
        padding: var(--space-xs);
        background: transparent;
        color: var(--ink);
        font: 500 var(--step--1)/1.2 var(--font-text);
        cursor: pointer;
      }

      .photo-editor input::file-selector-button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .photo-editor input::file-selector-button:active {
        background: var(--accent);
        color: var(--surface);
      }

      .photo-editor input::file-selector-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: var(--space-3xs);
      }

      .photo-editor__hint {
        margin: 0;
        color: var(--ink-3);
        font-size: var(--step--1);
      }

      .identity__label,
      .section-label,
      .detail__label {
        margin: 0;
        color: var(--ink-3);
        font-size: var(--step--1);
        font-weight: 500;
        letter-spacing: .1em;
        text-transform: uppercase;
      }

      .profile__name {
        max-width: 10ch;
        margin: 0;
        font-family: var(--font-display);
        font-size: var(--step-5);
        font-weight: 400;
        letter-spacing: -.045em;
        line-height: 1.05;
        text-wrap: balance;
      }

      .profile__role {
        margin: var(--space-m) 0 0;
        color: var(--ink-2);
        font-size: var(--step-1);
      }

      .details {
        margin-top: var(--space-3xl);
      }

      .section-label {
        margin-bottom: var(--space-m);
      }

      .detail-list {
        margin: 0;
        border-top: var(--border);
      }

      .detail {
        display: grid;
        grid-template-columns: minmax(8rem, .75fr) minmax(0, 1.5fr);
        gap: var(--space-m);
        padding-block: var(--space-m);
        border-bottom: var(--border);
      }

      .detail__label {
        align-self: center;
      }

      .detail__value {
        margin: 0;
        overflow-wrap: anywhere;
        color: var(--ink);
      }

      .detail__value a {
        color: inherit;
        text-decoration-color: var(--line);
        text-underline-offset: var(--space-3xs);
      }

      .detail__value a:hover {
        color: var(--accent);
        text-decoration-color: currentColor;
      }

      .detail__value a:active {
        color: var(--accent);
      }

      .detail__value a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: var(--space-3xs);
      }

      .edit-name-label {
        display: block;
        margin-bottom: var(--space-2xs);
        color: var(--ink-3);
        font-size: var(--step--1);
        font-weight: 500;
        letter-spacing: .1em;
        text-transform: uppercase;
      }

      .profile-input {
        width: 100%;
        min-height: 2.75rem;
        border: var(--border);
        border-radius: var(--radius);
        padding: var(--space-xs) var(--space-s);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }

      .profile-input:hover {
        border-color: var(--ink-3);
      }

      .profile-input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: var(--space-3xs);
      }

      .profile-input:disabled {
        background: var(--base);
        color: var(--ink-2);
        cursor: not-allowed;
      }

      .profile-input[aria-invalid="true"] {
        border-color: var(--accent);
      }

      .profile__name-input {
        max-width: 100%;
        font-family: var(--font-display);
        font-size: var(--step-4);
        line-height: 1.1;
      }

      .profile__actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-s);
        margin-top: var(--space-m);
      }

      .profile__button {
        min-height: 2.75rem;
        border: var(--border);
        border-radius: var(--radius);
        padding: var(--space-xs) var(--space-m);
        background: transparent;
        color: var(--ink);
        font: 500 var(--step--1)/1.2 var(--font-text);
        cursor: pointer;
        transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
      }

      .profile__button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .profile__button:active {
        background: var(--accent);
        color: var(--surface);
      }

      .profile__button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: var(--space-3xs);
      }

      .profile__button:disabled,
      .profile__button[aria-busy="true"] {
        opacity: .55;
        cursor: wait;
      }

      .profile__button--primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--surface);
      }

      .profile__button--primary:hover,
      .profile__button--primary:active {
        background: var(--ink);
        color: var(--surface);
      }

      .profile__status {
        min-height: 1.5em;
        margin: var(--space-s) 0 0;
        color: var(--ink-2);
        font-size: var(--step--1);
      }

      .profile__status[data-error="true"] {
        color: var(--accent);
      }

      [hidden] {
        display: none !important;
      }

      .folio {
        padding-block: var(--space-m);
        border-top: var(--border);
        color: var(--ink-3);
      }

      @media (max-width: 42rem) {
        .page {
          width: min(100% - var(--space-m), 72rem);
        }

        .masthead {
          padding-block: var(--space-m);
        }

        main {
          align-content: start;
          padding-block: var(--space-2xl);
        }

        .profile {
          grid-template-columns: 1fr;
          gap: var(--space-xl);
        }

        .identity {
          min-height: 0;
          flex-direction: row;
          align-items: center;
        }

        .identity__photo {
          width: var(--space-3xl);
        }

        .profile__name {
          font-size: var(--step-4);
        }

        .profile__name-input {
          font-size: var(--step-2);
        }

        .details {
          margin-top: var(--space-2xl);
        }

        .detail {
          grid-template-columns: minmax(5rem, .4fr) minmax(0, 1.6fr);
          gap: var(--space-s);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead" aria-label="Profile record">
        <p><span class="masthead__mark">Profile</span> / User details</p>
      </header>

      <main>
        <article class="profile" aria-labelledby="profile-name">
          <aside class="identity" aria-label="Profile identifier">
            <p class="identity__label">Personal profile</p>
            <img class="identity__photo" src="image.png" width="720" height="720" alt="Profile picture">
            <div class="photo-editor" id="photo-editor" hidden>
              <label for="photo-input">Change profile picture</label>
              <input id="photo-input" name="photo" type="file" accept="image/*" aria-describedby="photo-hint" hidden>
              <p class="photo-editor__hint" id="photo-hint">Choose an image up to 8 MB. It stays in this browser.</p>
            </div>
          </aside>

          <div class="profile__content">
            <form id="profile-form">
              <header>
                <h1 class="profile__name" id="profile-name">Ratakonda Dimpul</h1>
                <div id="name-editor" hidden>
                  <label class="edit-name-label" for="name-input">Name</label>
                  <input class="profile-input profile__name-input" id="name-input" name="name" autocomplete="name" required>
                </div>
              </header>

              <section class="details" aria-labelledby="details-heading">
                <h2 class="section-label" id="details-heading">Personal details</h2>
                <dl class="detail-list">
                  <div class="detail">
                    <dt class="detail__label" id="email-label">Email</dt>
                    <dd class="detail__value" data-display="email"><a href="mailto:ratakondadimpul2628@gmail.com">ratakondadimpul2628@gmail.com</a></dd>
                    <dd class="detail__value" data-editor="email" hidden><input class="profile-input" id="email-input" name="email" type="email" inputmode="email" autocomplete="email" aria-labelledby="email-label" required hidden></dd>
                  </div>
                  <div class="detail">
                    <dt class="detail__label" id="phone-label">Phone</dt>
                    <dd class="detail__value" data-display="phone"><a href="tel:+918328570644">+91 8328570644</a></dd>
                    <dd class="detail__value" data-editor="phone" hidden><input class="profile-input" id="phone-input" name="phone" type="tel" inputmode="tel" autocomplete="tel" aria-labelledby="phone-label" required hidden></dd>
                  </div>
                  <div class="detail">
                    <dt class="detail__label" id="location-label">Location</dt>
                    <dd class="detail__value" data-display="location">Vellore Institute of Technology</dd>
                    <dd class="detail__value" data-editor="location" hidden><input class="profile-input" id="location-input" name="location" autocomplete="address-level2" aria-labelledby="location-label" required hidden></dd>
                  </div>
                  <div class="detail">
                    <dt class="detail__label" id="joined-label">Joined</dt>
                    <dd class="detail__value" data-display="joined"><time datetime="2026-07-26">July 26, 2026</time></dd>
                    <dd class="detail__value" data-editor="joined" hidden><input class="profile-input" id="joined-input" name="joined" type="date" aria-labelledby="joined-label" required hidden></dd>
                  </div>
                </dl>
                <div class="profile__actions">
                  <button class="profile__button" id="edit-button" type="button">Edit details</button>
                  <button class="profile__button profile__button--primary" id="save-button" type="submit" hidden>Save changes</button>
                  <button class="profile__button" id="cancel-button" type="button" hidden>Cancel</button>
                </div>
                <p class="profile__status" id="profile-status" role="status" aria-live="polite"></p>
              </section>
            </form>
          </div>
        </article>
      </main>

      <footer class="folio">
        <p>Personal profile</p>
        <p>RD</p>
      </footer>
    </div>
    <script>
      (() => {
        const storageKey = "profile-system.user-details";
        const form = document.querySelector("#profile-form");
        const nameHeading = document.querySelector("#profile-name");
        const nameInput = document.querySelector("#name-input");
        const nameEditor = document.querySelector("#name-editor");
        const profilePhoto = document.querySelector(".identity__photo");
        const photoEditor = document.querySelector("#photo-editor");
        const photoInput = document.querySelector("#photo-input");
        const initials = document.querySelector(".folio p:last-child");
        const editButton = document.querySelector("#edit-button");
        const saveButton = document.querySelector("#save-button");
        const cancelButton = document.querySelector("#cancel-button");
        const status = document.querySelector("#profile-status");
        const fields = ["email", "phone", "location", "joined"];
        const defaults = {
          name: nameHeading.textContent.trim(),
          image: profilePhoto.getAttribute("src"),
          email: document.querySelector('[data-display="email"] a').textContent.trim(),
          phone: document.querySelector('[data-display="phone"] a').textContent.trim(),
          location: document.querySelector('[data-display="location"]').textContent.trim(),
          joined: document.querySelector('[data-display="joined"] time').dateTime
        };
        let profile = { ...defaults };
        let pendingImage = null;

        const setStatus = (message, isError = false) => {
          status.textContent = message;
          status.dataset.error = String(isError);
        };

        const displayDate = (value) => {
          const [year, month, day] = value.split("-").map(Number);
          return new Intl.DateTimeFormat("en", {
            month: "long",
            day: "numeric",
            year: "numeric"
          }).format(new Date(year, month - 1, day));
        };

        const updateDisplay = () => {
          nameHeading.textContent = profile.name;
          profilePhoto.src = profile.image;
          initials.textContent = profile.name.split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase();
          const emailLink = document.querySelector('[data-display="email"] a');
          emailLink.textContent = profile.email;
          emailLink.href = `mailto:${profile.email}`;
          const phoneLink = document.querySelector('[data-display="phone"] a');
          phoneLink.textContent = profile.phone;
          phoneLink.href = `tel:${profile.phone.replace(/[^\d+]/g, "")}`;
          document.querySelector('[data-display="location"]').textContent = profile.location;
          const joined = document.querySelector('[data-display="joined"] time');
          joined.dateTime = profile.joined;
          joined.textContent = displayDate(profile.joined);
          document.title = `Profile — ${profile.name}`;
        };

        const setEditing = (isEditing) => {
          nameHeading.hidden = isEditing;
          nameEditor.hidden = !isEditing;
          photoEditor.hidden = !isEditing;
          photoInput.hidden = !isEditing;
          editButton.hidden = isEditing;
          saveButton.hidden = !isEditing;
          cancelButton.hidden = !isEditing;
          for (const field of fields) {
            document.querySelector(`[data-display="${field}"]`).hidden = isEditing;
            const editor = document.querySelector(`[data-editor="${field}"]`);
            const input = editor.querySelector("input");
            editor.hidden = !isEditing;
            input.hidden = !isEditing;
          }
          if (isEditing) {
            pendingImage = null;
            profilePhoto.src = profile.image;
            photoInput.value = "";
            nameInput.value = profile.name;
            for (const field of fields) {
              document.querySelector(`#${field}-input`).value = profile[field];
            }
          }
        };

        try {
          const saved = localStorage.getItem(storageKey);
          if (saved !== null) {
            const parsed = JSON.parse(saved);
            if (typeof parsed !== "object" || parsed === null ||
                ["name", ...fields].some(field => typeof parsed[field] !== "string" || !parsed[field].trim())) {
              throw new Error("Saved profile details are incomplete.");
            }
            profile = {
              ...defaults,
              ...Object.fromEntries(["name", ...fields].map(field => [field, parsed[field]])),
              image: typeof parsed.image === "string" && parsed.image.startsWith("data:image/")
                ? parsed.image
                : defaults.image
            };
            updateDisplay();
          }
        } catch {
          setStatus("Saved details couldn't be loaded. Your current details are shown; edit and save to replace them.", true);
        }

        editButton.addEventListener("click", () => {
          setEditing(true);
          setStatus("Changes are saved only in this browser.");
          nameInput.focus();
        });

        cancelButton.addEventListener("click", () => {
          form.reset();
          pendingImage = null;
          profilePhoto.src = profile.image;
          setEditing(false);
          setStatus("Changes discarded.");
          editButton.focus();
        });

        photoInput.addEventListener("change", async () => {
          const file = photoInput.files?.[0];
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            photoInput.value = "";
            setStatus("Choose an image file to update your profile picture.", true);
            return;
          }
          if (file.size > 8 * 1024 * 1024) {
            photoInput.value = "";
            setStatus("That image is over 8 MB. Choose a smaller image.", true);
            return;
          }

          try {
            const bitmap = await createImageBitmap(file);
            if (bitmap.width * bitmap.height > 40000000) {
              bitmap.close();
              photoInput.value = "";
              setStatus("That image is too large to process. Choose a smaller image.", true);
              return;
            }
            const side = Math.min(bitmap.width, bitmap.height);
            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 512;
            const context = canvas.getContext("2d");
            if (!context) throw new Error("Image preview is unavailable.");
            context.drawImage(
              bitmap,
              (bitmap.width - side) / 2,
              (bitmap.height - side) / 2,
              side,
              side,
              0,
              0,
              canvas.width,
              canvas.height
            );
            bitmap.close();
            pendingImage = canvas.toDataURL("image/webp", 0.82);
            profilePhoto.src = pendingImage;
            setStatus("Picture preview updated. Save changes to keep it.");
          } catch {
            photoInput.value = "";
            setStatus("That image couldn't be opened. Choose another image file.", true);
          }
        });

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (!form.reportValidity()) return;

          const nextProfile = Object.fromEntries(
            ["name", ...fields].map(field => [field, document.querySelector(`#${field}-input`).value.trim()])
          );
          nextProfile.image = pendingImage || profile.image;
          if (Object.values(nextProfile).some(value => !value)) {
            setStatus("Complete every field before saving.", true);
            return;
          }

          try {
            localStorage.setItem(storageKey, JSON.stringify(nextProfile));
          } catch {
            setStatus("Your changes couldn't be saved in this browser. Keep editing and try again.", true);
            return;
          }

          profile = nextProfile;
          updateDisplay();
          setEditing(false);
          setStatus("Profile details saved in this browser.");
          editButton.focus();
        });
      })();
    </script>
  </body>
</html>
